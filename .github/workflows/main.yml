name: Daily census
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/census.py
      - run: python scripts/rank.py
      - run: python scripts/track.py
      - run: |
          git config user.name "census-bot"
          git config user.email "census-bot@users.noreply.github.com"
          git add data
          git commit -m "Census $(date -u +%F)" || echo "nothing to commit"
          git push
