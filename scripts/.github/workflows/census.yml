name: Daily census
on:
  schedule:
    - cron: "0 6 * * *"     # 06:00 UTC every day
  workflow_dispatch:         # allows a manual run from the Actions tab
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/census.py
      - run: |
          git config user.name "census-bot"
          git config user.email "census-bot@users.noreply.github.com"
          git add data/census
          git commit -m "Census $(date -u +%F)" || echo "nothing to commit"
          git push
